# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Development-specific overrides for Redis
  redis:
    container_name: downloadarr-redis-dev
    volumes:
      - redis_data_dev:/data

  # Development-specific overrides for PostgreSQL
  postgres:
    container_name: downloadarr-postgres-dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  # Development-specific overrides for Downloadarr: one container running the
  # API (nest --watch) and the UI (Vite), both with hot reload
  downloadarr:
    # A local tag, so the dev build is what runs. Without it the base file's
    # ghcr.io/...:latest tag wins and a pulled release image runs instead.
    image: downloadarr:dev
    build:
      dockerfile: Dockerfile.dev
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: downloadarr-dev
    ports:
      - "3000:3000" # Vite dev server: the UI with hot reload
    environment:
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      # Inherit base volumes from docker-compose.yml
      - ${DOWNLOAD_PATH}:/app/downloads
      - ${LIBRARY_PATH}:/app/library
      - ./config:/app/config:ro
      # Add development-specific volumes
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/api/prisma:/app/packages/api/prisma
      - ./packages/ui/src:/app/packages/ui/src:ro

  # Development-specific overrides for Prowlarr
  prowlarr:
    container_name: downloadarr-prowlarr-dev
    volumes:
      # Inherit base volumes from docker-compose.yml
      - prowlarr_config_dev:/config

  # Development-specific overrides for Aria2
  aria2:
    container_name: downloadarr-aria2-dev
    volumes:
      # Inherit base volumes from docker-compose.yml
      - aria2_config_dev:/config
      - ${DOWNLOAD_PATH}:/downloads

  # Development-specific overrides for AriaNG
  ariang:
    container_name: downloadarr-ariang-dev

# Development-specific volumes
volumes:
  redis_data_dev:
  postgres_data_dev:
  prowlarr_config_dev:
  aria2_config_dev:
